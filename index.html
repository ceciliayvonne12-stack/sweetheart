<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>团建相册</title>
<style>
  body { font-family: sans-serif; background: #f7f0e6; margin: 0; padding: 10px; color: #333; }
  h1 { font-size: 22px; margin: 10px 0; }
  .desc { color: #666; font-size: 14px; margin-bottom: 10px; }
  button { background: #d98e5a; color: #fff; border: none; padding: 10px 16px; border-radius: 8px; font-size: 16px; margin: 5px 0; cursor: pointer; }
  input, select { padding: 10px; border-radius: 8px; border: 1px solid #ccc; font-size: 16px; margin: 5px 0; box-sizing: border-box; }
  .tabs { display: flex; gap: 10px; margin: 15px 0; }
  .tab { background: #eee; color: #333; }
  .tab.active { background: #d98e5a; color: #fff; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .card { background: #fff; padding: 10px; border-radius: 12px; text-align: center; }
  .card img { width: 100%; height: 120px; object-fit: cover; border-radius: 8px; background: #ddd; }
  .tag { display: inline-block; background: #f0e0d0; color: #d98e5a; border-radius: 6px; padding: 2px 8px; font-size: 12px; margin-top: 5px; }
  .add-form { margin-top: 20px; display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
  .add-form input { flex: 1; min-width: 120px; }
  #toast { display: none; position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); color: #fff; padding: 10px 20px; border-radius: 8px; z-index: 9999; }
  #configModal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 9998; align-items: center; justify-content: center; }
  #configModal.active { display: flex; }
  .modal-box { background: #fff; padding: 20px; border-radius: 12px; width: 90%; max-width: 320px; }
  .modal-box label { display: block; margin: 10px 0 5px; font-size: 14px; }
  .modal-box input { width: 100%; margin: 0; }
  .sync-area { margin-top: 30px; padding: 20px 0; text-align: center; border-top: 1px solid #ccc; }
</style>
</head>
<body>
<div id="toast"></div>
<h1>🧡 团建相册</h1>
<div class="desc">大家看到的是同一份内容，上传和留言会同步</div>
<button id="cfgBtn" style="float:right;">云配置</button>

<div class="tabs">
  <button class="tab active" id="tabP">成员</button>
  <button class="tab" id="tabG">小组</button>
</div>

<div id="list" class="grid"></div>

<div class="add-form">
  <input type="text" id="newName" placeholder="新成员姓名">
  <select id="newGroup"><option>未分组</option></select>
  <button id="addBtn">添加</button>
</div>

<div class="sync-area">
  <button id="syncBtn">☁ 同步到云端</button>
</div>

<div id="configModal">
  <div class="modal-box">
    <h3>云配置</h3>
    <label>Gist ID</label><input id="cfg-gist">
    <label>GitHub Token</label><input id="cfg-token" type="password">
    <button id="saveCfg">保存并同步</button>
    <button onclick="document.getElementById('configModal').classList.remove('active')" style="background:#999;">取消</button>
  </div>
</div>

<input type="file" id="file" accept="image/*" style="display:none">

<script>
let D = {people:[{id:'1',name:'亚梦',gids:[],img:''}],groups:[],ts:0};
let GIST_ID=localStorage.getItem("gist_id")||"";
let GITHUB_TOKEN=localStorage.getItem("gist_token")||"";
let pending=null;
const pmax=600;

function $(id){return document.getElementById(id)}
function uid(){return Math.random().toString(36).slice(2,9)}
function by(arr,id){return arr.find(x=>x.id===id)}
function showToast(t){const o=$("toast");o.textContent=t;o.style.display="block";setTimeout(()=>o.style.display="none",1800)}
function saveState(){localStorage.setItem("data",JSON.stringify(D))}
function loadState(){try{const s=localStorage.getItem("data");if(s)D=JSON.parse(s)}catch(e){}}

loadState();

function render(){
  const list=$("list"); list.innerHTML="";
  D.people.forEach(p=>{
    const div=document.createElement("div"); div.className="card";
    div.innerHTML=`<div>${p.img?'<img src="'+p.img+'">':'<div style="height:120px;background:#ddd;border-radius:8px;"></div>'}</div><div style="margin-top:5px;font-weight:bold">${p.name}</div><div class="tag">${p.gids[0]||'未分组'}</div><button onclick="upPhoto('${p.id}')">📷上传</button>`;
    list.appendChild(div);
  });
  const sel=$("newGroup"); sel.innerHTML='<option>未分组</option>'+D.groups.map(g=>`<option>${g}</option>`).join('');
}
render();

function upPhoto(id){
  pending=d=>{by(D.people,id).img=d; D.ts=Date.now(); saveState(); syncCloud(true); render()};
  $("file").click();
}
function addMember(){
  const n=$("newName").value.trim(); if(!n)return;
  D.people.push({id:uid(),name:n,gids:[],img:''});
  $("newName").value=""; D.ts=Date.now(); saveState(); syncCloud(true); render();
}

async function syncCloud(force){
  if(!GIST_ID||!GITHUB_TOKEN){showToast("先点右上角云配置");return}
  try{
    const raw="https://gist.githubusercontent.com/"+GIST_ID+"/raw/data.json";
    if(force)try{const r=await fetch(raw);if(r.ok){const d=await r.json();if(d&&d.ts>D.ts)D=d;showToast("拉取云端成功")}}catch(e){}
    await fetch("https://api.github.com/gists/"+GIST_ID,{
      method:"PATCH",
      headers:{Authorization:"token "+GITHUB_TOKEN,Content-Type:"application/json"},
      body:JSON.stringify({files:{"data.json":{content:JSON.stringify({...D,ts:Date.now()})}}})
    });
    showToast("☁ 已同步"); saveState(); render();
  }catch(e){showToast("同步失败，检查Token")}
}

// 云配置
$("cfgBtn").onclick=()=>{
  $("cfg-gist").value=GIST_ID; $("cfg-token").value=GITHUB_TOKEN;
  $("configModal").classList.add("active");
};
$("saveCfg").onclick=()=>{
  GIST_ID=$("cfg-gist").value.trim();
  GITHUB_TOKEN=$("cfg-token").value.trim();
  localStorage.setItem("gist_id",GIST_ID);
  localStorage.setItem("gist_token",GITHUB_TOKEN);
  $("configModal").classList.remove("active");
  showToast("已保存配置，正在同步");
  syncCloud(true);
};
$("syncBtn").onclick=()=>syncCloud(true);
$("addBtn").onclick=addMember;
$("tabP").onclick=()=>{render()};
$("tabG").onclick=()=>{showToast("小组视图暂略")};

// 文件上传
const fi=$("file");
fi.onchange=function(){
  const f=this.files[0]; this.value=""; if(!f||!pending)return;
  const fr=new FileReader();
  fr.onload=function(){
    const im=new Image();
    im.onload=function(){
      const k=Math.min(1,pmax/Math.max(im.width,im.height));
      const c=document.createElement("canvas");
      c.width=Math.round(im.width*k); c.height=Math.round(im.height*k);
      c.getContext("2d").drawImage(im,0,0,c.width,c.height);
      const cb=pending; pending=null;
      cb(c.toDataURL("image/jpeg",.7));
    };
    im.src=fr.result;
  };
  fr.readAsDataURL(f);
};

if(GIST_ID&&GITHUB_TOKEN)syncCloud(true);
</script>
</body>
</html>
